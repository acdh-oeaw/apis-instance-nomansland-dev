{% extends parent_template|default:"django_cosmograph/base.html" %}

{% block dc_content %}
<div class="container-fluid py-2">
    <form method="get" class="row g-2 align-items-center justify-content-center mb-2">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <input
                type="search"
                name="q"
                value="{{ graph_query }}"
                class="form-control form-control-sm"
                placeholder="Filter nodes by label, group, or id"
                aria-label="Filter graph"
            >
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary btn-sm">Filter</button>
        </div>
        {% if graph_query %}
        <div class="col-auto">
            <a href="?" class="btn btn-outline-secondary btn-sm">Clear</a>
        </div>
        {% endif %}
    </form>
</div>

{% include "django_cosmograph/cosmograph_partial.html" %}
{% endblock dc_content %}
